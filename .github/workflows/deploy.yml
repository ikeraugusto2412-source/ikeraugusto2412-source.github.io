# Publishes the site to GitHub Pages (https://ikeraugusto2412-source.github.io) on every push to main.
# Optional settings live in Settings › Secrets and variables › Actions › Variables:
#   VITE_WEB3FORMS_KEY (contact form), VITE_UMAMI_WEBSITE_ID (visit statistics) and
#   VITE_UMAMI_SHARE_ID (live visitors pill, from the Umami share URL).
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check that every referenced photo/video/sound exists
        run: npm run check:assets

      - name: Build
        run: npm run build
        env:
          VITE_SITE_URL: https://ikeraugusto2412-source.github.io
          VITE_WEB3FORMS_KEY: ${{ vars.VITE_WEB3FORMS_KEY }}
          VITE_UMAMI_WEBSITE_ID: ${{ vars.VITE_UMAMI_WEBSITE_ID }}
          VITE_UMAMI_SHARE_ID: ${{ vars.VITE_UMAMI_SHARE_ID }}
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
